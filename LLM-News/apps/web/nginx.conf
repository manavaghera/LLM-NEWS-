server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    # API. Buffering is off so streamed chat replies reach the browser as they are written.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;  # digests and translations are LLM calls that can take a while
    }

    # Link previews, the RSS feed, robots.txt and the sitemap are built by the backend.
    # $http_host keeps the port in their links.
    location /share/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(feed\.xml|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Article images and audio, straight from the news folder (mounted read-only from the host), so
    # Python never serves files. nginx handles range requests for audio seeking itself.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
    }

    # Fingerprinted build output never changes
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path loads index.html and the router takes over
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
