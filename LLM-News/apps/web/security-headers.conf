# Security headers for every response (included by nginx.conf: nginx drops inherited add_header lines in a
# location that sets its own, so locations with their own headers include this file again).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Only this site's own scripts (none inline); inline styles are allowed for React style attributes.
# If article photos are ever loaded from the publishers' sites, add their hosts (or https:) to img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
