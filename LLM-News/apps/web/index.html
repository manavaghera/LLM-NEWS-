<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-written daily news where every claim links to its source." />
    <link rel="alternate" type="application/rss+xml" title="NewsSense" href="/feed.xml" />
    <title>NewsSense</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a light/dark flash
      (function () {
        var theme = null
        try { theme = localStorage.getItem('newssense-theme') } catch (e) {}
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
