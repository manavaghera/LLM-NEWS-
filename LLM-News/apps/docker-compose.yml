# Docker's default logs grow without limit: keep at most 3 files of 10 MB per service
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-newssense}
      - POSTGRES_USER=${POSTGRES_USER:-newssense}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-newssense-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    expose:
      - "8000"
    environment:
      - DEBUG=false
      - CACHE_DIR=/app/cache
      - DATABASE_URL=postgresql://${POSTGRES_USER:-newssense}@database:5432/${POSTGRES_DB:-newssense}
      - PGPASSWORD=${POSTGRES_PASSWORD:-newssense-development-only}
      # Only nginx can reach the backend, so its X-Forwarded-For header identifies visitors for rate limits
      - TRUST_PROXY_HEADERS=true
    volumes:
      - ${NEWS_DATA_DIR:-./static}:/app/static:ro
      - cache:/app/cache  # generated translations, digests and audio
    env_file:
      # Set APP_ENV_FILE when staging and production use separate secret files.
      - ${APP_ENV_FILE:-../.env}
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # python:3.11-slim has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: web
    ports:
      - "3000:80"
    volumes:
      - ${NEWS_DATA_DIR:-./static}:/usr/share/nginx/static:ro  # nginx serves article images and audio itself
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to IPv6 first and nginx listens on IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # New stories every UPDATE_MINUTES (default 60; set it in ../.env). It calls the AI, so it is opt-in:
  #   docker compose --profile updates up -d --build
  updater:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    profiles: ["updates"]
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      - BACKEND_URL=http://backend:8000  # prepares the digest and briefing after new stories
      - CACHE_DIR=/app/apps/cache
      - DATABASE_URL=postgresql://${POSTGRES_USER:-newssense}@database:5432/${POSTGRES_DB:-newssense}
      - PGPASSWORD=${POSTGRES_PASSWORD:-newssense-development-only}
    # The deploy script supplies the host news directory's group so this non-root user can publish.
    group_add:
      - ${NEWS_DATA_GID:-1000}
    volumes:
      - ${NEWS_DATA_DIR:-./static}:/app/apps/static  # the only service that writes the news
      - cache:/app/apps/cache  # persistent usage and budget shared with the admin dashboard
    depends_on:
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Restores durable editions/media before the read-only frontend and backend mounts start.
  storage-init:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    env_file:
      - ${APP_ENV_FILE:-../.env}
    group_add:
      - ${NEWS_DATA_GID:-1000}
    volumes:
      - ${NEWS_DATA_DIR:-./static}:/app/apps/static
    command: ["python", "apps/app/core/object_storage.py", "pull", "/app/apps/static"]
    restart: "no"
    logging: *logging

  worker:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    profiles: ["updates"]
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      - BACKEND_URL=http://backend:8000
      - CACHE_DIR=/app/apps/cache
      - UPDATE_MINUTES=${UPDATE_MINUTES:-60}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-newssense}@database:5432/${POSTGRES_DB:-newssense}
      - PGPASSWORD=${POSTGRES_PASSWORD:-newssense-development-only}
    group_add:
      - ${NEWS_DATA_GID:-1000}
    volumes:
      - ${NEWS_DATA_DIR:-./static}:/app/apps/static
      - cache:/app/apps/cache
    command: ["python", "pipeline/job_worker.py"]
    depends_on:
      backend:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  cache:
  postgres_data:
