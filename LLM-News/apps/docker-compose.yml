# Docker's default logs grow without limit: keep at most 3 files of 10 MB per service
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: .
    expose:
      - "8000"
    environment:
      - DEBUG=false
      # Only nginx can reach the backend, so its X-Forwarded-For header identifies visitors for rate limits
      - TRUST_PROXY_HEADERS=true
    volumes:
      - ./static:/app/static:ro
      - cache:/app/cache  # generated translations, digests and audio
    env_file:
      - ../.env
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # python:3.11-slim has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: web
    ports:
      - "3000:80"
    volumes:
      - ./static:/usr/share/nginx/static:ro  # nginx serves article images and audio itself
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to IPv6 first and nginx listens on IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # New stories every UPDATE_MINUTES (default 60; set it in ../.env). It calls the AI, so it is opt-in:
  #   docker compose --profile updates up -d --build
  updater:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile
    profiles: ["updates"]
    env_file:
      - ../.env
    environment:
      - BACKEND_URL=http://backend:8000  # prepares the digest and briefing after new stories
    volumes:
      - ./static:/app/apps/static  # the only service that writes the news
    depends_on:
      - backend
    restart: unless-stopped
    logging: *logging

volumes:
  cache:
