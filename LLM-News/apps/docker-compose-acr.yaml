# Same stack as docker-compose.yml, but using images pushed to Alibaba Cloud Container Registry
# (see Makefile: make build-push). The backend is only reachable through the frontend's nginx.
services:
  backend:
    image: ${ALIYUN_REGISTRY:-registry.example.com}/${ALIYUN_NAMESPACE:-llm-newshub}/${ALIYUN_BACKEND_IMAGE:-newsense-backend}:latest
    expose:
      - "8000"
    environment:
      - DEBUG=false
      # Only nginx can reach the backend, so its X-Forwarded-For header identifies visitors for rate limits
      - TRUST_PROXY_HEADERS=true
    volumes:
      - ./static:/app/static:ro
      - cache:/app/cache  # generated translations, digests, audio and reader reports
    env_file:
      - ../.env
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${ALIYUN_REGISTRY:-registry.example.com}/${ALIYUN_NAMESPACE:-llm-newshub}/${ALIYUN_FRONTEND_IMAGE:-newsense-frontend}:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to IPv6 first and nginx listens on IPv4
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cache:

networks:
  default:
    name: ai-newssense
