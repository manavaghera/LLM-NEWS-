name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LLM-News/apps
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LLM-News/apps/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  news-script:
    name: News script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LLM-News
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LLM-News/requirements/quick_news.txt
      - run: pip install -r requirements/quick_news.txt pytest==8.3.4
      - run: python -m pytest tests -q

  web:
    name: Web frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LLM-News/apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LLM-News/apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LLM-News/apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LLM-News/apps/requirements*.txt
      - run: pip install -r ../requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LLM-News/apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: LLM-News/apps/web/test-results/
          retention-days: 7
